<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>OCI</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f4f3f0; --surface: #ffffff; --surface2: #f0efe9;
  --border: rgba(0,0,0,0.10); --border2: rgba(0,0,0,0.18);
  --text: #1a1917; --text2: #6b6a65; --text3: #aaa9a3;
  --accent: #1a5fa8; --accent2: rgba(26,95,168,0.08);
  --radius: 10px; --radius-lg: 14px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

#grid-view { flex: 1; overflow-y: auto; padding: 1.5rem; }
.grid-header { margin-bottom: 1.5rem; }
.grid-header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.grid-header p  { font-size: 13px; color: var(--text2); }

.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }

.oci-card {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--radius-lg); padding: 1.25rem;
  cursor: pointer; transition: all 0.16s;
  display: flex; flex-direction: column; gap: 10px;
  position: relative; overflow: hidden;
}
.oci-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--card-color, var(--accent)); }
.oci-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.10); border-color: var(--card-color, var(--accent)); transform: translateY(-2px); }

.oci-icon { font-size: 28px; }
.oci-name { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.3; }
.oci-tag  { font-size: 11px; font-weight: 600; color: var(--card-color, var(--accent)); background: var(--card-bg, var(--accent2)); padding: 3px 8px; border-radius: 20px; width: fit-content; }
.oci-open { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text3); margin-top: auto; padding-top: 4px; }

#dash-view { display: none; flex-direction: column; height: 100%; }
#dash-view.active { display: flex; }
.dash-topbar { display: flex; align-items: center; gap: 10px; padding: 8px 1rem; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
.btn-back { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text2); cursor: pointer; background: none; border: none; font-family: inherit; padding: 5px 8px; border-radius: 6px; transition: background 0.13s; }
.btn-back:hover { background: var(--surface2); color: var(--text); }
.sep { color: var(--border2); }
.dash-title { font-size: 14px; font-weight: 700; color: var(--text); }
.btn-newwindow { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--accent); cursor: pointer; background: var(--accent2); border: none; font-family: inherit; padding: 5px 10px; border-radius: 6px; font-weight: 600; transition: opacity 0.13s; text-decoration: none; }
.btn-newwindow:hover { opacity: 0.8; }
.dash-frame { flex: 1; border: none; width: 100%; }

@media(max-width:480px){ .cards-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="grid-view">
  <div class="grid-header">
    <h1>🗂️ OCI — Oferta de Cuidados Integrados</h1>
    <p>Sistemas de gestão e acompanhamento das OCIs.</p>
  </div>
  <div class="cards-grid" id="cards-grid"></div>
</div>

<div id="dash-view">
  <div class="dash-topbar">
    <button class="btn-back" onclick="voltarGrid()">← Voltar</button>
    <span class="sep">/</span>
    <span class="dash-title" id="dash-title"></span>
    <a class="btn-newwindow" id="btn-newwindow" href="#" target="_blank" rel="noopener">↗ Abrir em nova aba</a>
  </div>
  <iframe class="dash-frame" id="dash-frame" src="" allowfullscreen></iframe>
</div>

<script>
const OCI = [
  {
    nome: 'SINFRA OCI',
    icone: '🗂️',
    tag: 'Fila de OCIs',
    cor: '#be123c', bgCor: 'rgba(190,18,60,0.08)',
    url: 'https://sinfra-oci.web.app/'
  },
  {
    nome: 'Gestor OCI',
    icone: '⚙️',
    tag: 'Gestão',
    cor: '#1a5fa8', bgCor: 'rgba(26,95,168,0.08)',
    url: 'https://phtries.github.io/gestor_oci_franca/'
  }
];

const grid = document.getElementById('cards-grid');
OCI.forEach(item => {
  const card = document.createElement('div');
  card.className = 'oci-card';
  card.style.setProperty('--card-color', item.cor);
  card.style.setProperty('--card-bg', item.bgCor);
  card.innerHTML = `
    <div class="oci-icon">${item.icone}</div>
    <div class="oci-name">${item.nome}</div>
    <div class="oci-tag">${item.tag}</div>
    <div class="oci-open">▶ Clique para abrir</div>`;
  card.onclick = () => abrirDashboard(item);
  grid.appendChild(card);
});

function abrirDashboard(item) {
  document.getElementById('dash-title').textContent = item.icone + ' ' + item.nome;
  document.getElementById('btn-newwindow').href = item.url;
  document.getElementById('dash-frame').src = item.url;
  document.getElementById('grid-view').style.display = 'none';
  document.getElementById('dash-view').classList.add('active');
}

function voltarGrid() {
  document.getElementById('dash-frame').src = '';
  document.getElementById('dash-view').classList.remove('active');
  document.getElementById('grid-view').style.display = 'block';
}
</script>
</body>
</html>
