<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Links Úteis</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f4f3f0; --surface: #ffffff; --surface2: #f0efe9;
  --border: rgba(0,0,0,0.10); --border2: rgba(0,0,0,0.18);
  --text: #1a1917; --text2: #6b6a65; --text3: #aaa9a3;
  --accent: #1a5fa8; --accent2: rgba(26,95,168,0.08);
  --radius: 10px; --radius-lg: 14px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 1.5rem; }

.header { margin-bottom: 1.25rem; }
.header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.header p  { font-size: 13px; color: var(--text2); }

.search-box { margin-bottom: 1.25rem; }
.search-box input {
  width: 100%; max-width: 400px; height: 38px; padding: 0 12px;
  border: 1px solid var(--border2); border-radius: var(--radius);
  background: var(--surface); font-size: 14px; color: var(--text);
  outline: none; font-family: inherit; transition: border-color 0.15s;
}
.search-box input:focus { border-color: var(--accent); }

.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }

.link-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius-lg);
  padding: 1.1rem;
  cursor: pointer;
  transition: all 0.15s;
  display: flex; flex-direction: column; gap: 8px;
  position: relative; overflow: hidden;
  text-decoration: none; color: inherit;
}
.link-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--card-color, var(--accent));
}
.link-card:hover { box-shadow: 0 5px 20px rgba(0,0,0,0.10); border-color: var(--card-color, var(--accent)); transform: translateY(-2px); }

.link-icon { font-size: 26px; }
.link-name { font-size: 13.5px; font-weight: 700; color: var(--text); line-height: 1.3; }
.link-host { font-size: 11px; color: var(--text3); word-break: break-all; }
.link-open { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--card-color, var(--accent)); margin-top: auto; padding-top: 2px; font-weight: 600; }

.no-results { display: none; padding: 2rem; text-align: center; color: var(--text3); font-size: 14px; }
.no-results.visible { display: block; }

@media(max-width:480px){ .cards-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="header">
  <h1>🔗 Links Úteis</h1>
  <p>Atalhos para sistemas e portais usados no dia a dia. Clique para abrir em nova aba.</p>
</div>

<div class="search-box">
  <input type="text" id="busca" placeholder="🔍 Filtrar por nome..." oninput="filtrar()" />
</div>

<div class="cards-grid" id="cards-grid"></div>
<div class="no-results" id="no-results">Nenhum link encontrado.</div>

<script>
const LINKS = [
  { nome: 'E-mail (Outlook)', icone: '📧', cor: '#0078d4', url: 'https://outlook.office.com/mail/' },
  { nome: 'Trello — DMADT', icone: '📌', cor: '#0079bf', url: 'https://trello.com/b/AFQmaXXJ/dmadt' },
  { nome: 'Ferramentas do Departamento', icone: '🧰', cor: '#1a5fa8', url: 'https://crismelol-cloud.github.io/ferramentas-departamento/' },
  { nome: 'Ouvidoria', icone: '📣', cor: '#b45309', url: 'https://ouvidoria.softwarecidade.com.br/registro/?id_orgao=28' },
  { nome: 'Portal SEI', icone: '📂', cor: '#6b21a8', url: 'https://sei.univesp.br/visaoAluno/dadosPessoaisAluno.xhtml?faces-redirect=true' },
  { nome: 'Portal da Transparência', icone: '🔍', cor: '#0f766e', url: 'https://www3.franca.sp.gov.br/console' },
  { nome: 'Holerite (Senior)', icone: '💰', cor: '#15803d', url: 'https://platform.senior.com.br/login/?redirectTo=https%3A%2F%2Fplatform.senior.com.br%2Fsenior-x%2F&tenant=franca.sp.gov.br' },
  { nome: 'Novo Portal Carta de Serviços', icone: '📋', cor: '#1a5fa8', url: 'https://www3.franca.sp.gov.br/cartadeservicos/admin/servicos' },
  { nome: 'Suporte TI', icone: '🖥️', cor: '#be123c', url: 'https://suporte.franca.sp.gov.br/index.php?noAUTO=1' },
  { nome: 'SAPO — Pré Operatório', icone: '🩺', cor: '#0f766e', url: 'https://phtries.github.io/sapo_regulacao_franca/' },
  { nome: 'Drive DMADT', icone: '📁', cor: '#b45309', url: 'https://drive.google.com/drive/folders/15BzrlhTPhfqiMBcDyCXzoVcmgbGzfbFT?usp=sharing' },
  { nome: 'SIRESP', icone: '🏥', cor: '#0284c7', url: 'https://www.siresp.saude.sp.gov.br/' },
  { nome: 'Portal das Parcerias', icone: '🤝', cor: '#6b21a8', url: 'https://franca.portaldasparcerias.com.br/login' },
  { nome: 'Claude IA', icone: '🤖', cor: '#c2410c', url: 'https://claude.ai/login' },
  { nome: 'GitHub', icone: '🐙', cor: '#1a1917', url: 'https://github.com/' }
];

function getHost(url) {
  try { return new URL(url).hostname.replace('www.',''); }
  catch(e) { return url; }
}

const grid = document.getElementById('cards-grid');
LINKS.forEach(link => {
  const a = document.createElement('a');
  a.className = 'link-card';
  a.href = link.url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.dataset.nome = link.nome.toLowerCase();
  a.style.setProperty('--card-color', link.cor);
  a.innerHTML = `
    <div class="link-icon">${link.icone}</div>
    <div class="link-name">${link.nome}</div>
    <div class="link-host">${getHost(link.url)}</div>
    <div class="link-open">↗ Abrir</div>`;
  grid.appendChild(a);
});

function filtrar() {
  const termo = document.getElementById('busca').value.toLowerCase().trim();
  let visiveis = 0;
  document.querySelectorAll('.link-card').forEach(card => {
    const mostra = !termo || card.dataset.nome.includes(termo);
    card.style.display = mostra ? 'flex' : 'none';
    if (mostra) visiveis++;
  });
  document.getElementById('no-results').classList.toggle('visible', visiveis === 0);
}
</script>
</body>
</html>
