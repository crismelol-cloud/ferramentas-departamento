<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Monitoramento</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f4f3f0; --surface: #ffffff; --surface2: #f0efe9;
  --border: rgba(0,0,0,0.10); --border2: rgba(0,0,0,0.18);
  --text: #1a1917; --text2: #6b6a65; --text3: #aaa9a3;
  --accent: #1a5fa8; --accent2: rgba(26,95,168,0.08);
  --radius: 10px; --radius-lg: 14px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 1.5rem; }

.header { margin-bottom: 1.5rem; }
.header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.header p  { font-size: 13px; color: var(--text2); }

.search-box { margin-bottom: 1.25rem; }
.search-box input {
  width: 100%; max-width: 400px; height: 38px; padding: 0 12px;
  border: 1px solid var(--border2); border-radius: var(--radius);
  background: var(--surface); font-size: 14px; color: var(--text);
  outline: none; font-family: inherit; transition: border-color 0.15s;
}
.search-box input:focus { border-color: var(--accent); }

.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }

.mon-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius-lg);
  padding: 1.1rem;
  cursor: pointer;
  transition: all 0.15s;
  display: flex; flex-direction: column; gap: 8px;
  position: relative; overflow: hidden;
  text-decoration: none; color: inherit;
}
.mon-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--card-color, var(--accent));
}
.mon-card:hover { box-shadow: 0 5px 20px rgba(0,0,0,0.10); border-color: var(--card-color, var(--accent)); transform: translateY(-2px); }

.mon-icon { font-size: 24px; }
.mon-name { font-size: 13.5px; font-weight: 700; color: var(--text); line-height: 1.3; }
.mon-tag  { font-size: 10.5px; font-weight: 600; color: var(--card-color, var(--accent)); background: var(--card-bg, var(--accent2)); padding: 3px 8px; border-radius: 20px; width: fit-content; }
.mon-open { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text3); margin-top: auto; padding-top: 2px; }

.no-results { display: none; padding: 2rem; text-align: center; color: var(--text3); font-size: 14px; }
.no-results.visible { display: block; }

@media(max-width:480px){ .cards-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="header">
  <h1>📈 Monitoramento</h1>
  <p>Planilhas e documentos de monitoramento on-line. Clique para abrir em nova aba.</p>
</div>

<div class="search-box">
  <input type="text" id="busca" placeholder="🔍 Filtrar por nome..." oninput="filtrar()" />
</div>

<div class="cards-grid" id="cards-grid"></div>
<div class="no-results" id="no-results">Nenhum item encontrado.</div>

<script>
const ITENS = [
  {
    nome: 'Taxa de Ocupação SRT',
    icone: '🏠',
    tag: 'Saúde Mental',
    cor: '#6b21a8', bgCor: 'rgba(107,33,168,0.08)',
    url: 'https://docs.google.com/spreadsheets/d/1ppNtSAHpAd1mddKeUPzxYPLz3MSz14h-tZCkaYi8XNg/edit?usp=sharing'
  },
  {
    nome: 'Lista de Internações CT',
    icone: '📋',
    tag: 'Saúde Mental',
    cor: '#6b21a8', bgCor: 'rgba(107,33,168,0.08)',
    url: 'https://docs.google.com/spreadsheets/d/1n9ERksQttzQLBdILOIYs7QrxJQBE7HnYTCHg1bDEzHs/edit?usp=sharing'
  },
  {
    nome: 'Taxa de Ocupação CT',
    icone: '🛏️',
    tag: 'Saúde Mental',
    cor: '#6b21a8', bgCor: 'rgba(107,33,168,0.08)',
    url: 'https://docs.google.com/spreadsheets/d/1KA08zeiMfGbI-feWhJ65YSiS15X6DjH-arMKNG7CqAg/edit?usp=sharing'
  },
  {
    nome: 'Taxa de Ocupação CAPS III',
    icone: '🏥',
    tag: 'Saúde Mental',
    cor: '#6b21a8', bgCor: 'rgba(107,33,168,0.08)',
    url: 'https://docs.google.com/spreadsheets/d/14ViWQId6Ajeuduw41--Wn4zlOKC5Slw5xLeUmBVizqo/edit?usp=sharing'
  },
  {
    nome: 'Taxa de Ocupação CAPS AD III',
    icone: '🏥',
    tag: 'Saúde Mental',
    cor: '#6b21a8', bgCor: 'rgba(107,33,168,0.08)',
    url: 'https://docs.google.com/spreadsheets/d/1QVfppoXU9Wyc4_p3gWg7zok9RW2nWAJnZssJB-zv39Y/edit?usp=sharing'
  },
  {
    nome: 'Demanda Interna UAC',
    icone: '🏨',
    tag: 'UAC',
    cor: '#0f766e', bgCor: 'rgba(15,118,110,0.08)',
    url: 'https://docs.google.com/spreadsheets/d/1FBlmEu7At5lezxM_R_Q2f70s2jhAQ5CuOkp7ayw9uQ4/edit?usp=sharing'
  },
  {
    nome: 'Atendimento Ultrassom',
    icone: '🩻',
    tag: 'Exames',
    cor: '#1a5fa8', bgCor: 'rgba(26,95,168,0.08)',
    url: 'https://docs.google.com/spreadsheets/d/1OzMI0THB51dTe28Ih78BfUmROygv6-ZcRN0C-NXUahk/edit?usp=sharing'
  },
  {
    nome: 'Controle de Envios — DMADT Franca',
    icone: '📤',
    tag: 'DMADT',
    cor: '#b45309', bgCor: 'rgba(180,83,9,0.08)',
    url: 'https://docs.google.com/spreadsheets/d/1OzMI0THB51dTe28Ih78BfUmROygv6-ZcRN0C-NXUahk/edit?usp=sharing'
  },
  {
    nome: 'Campanhas Semanais Oftalmo',
    icone: '👁️',
    tag: 'Oftalmologia',
    cor: '#be123c', bgCor: 'rgba(190,18,60,0.08)',
    url: 'https://docs.google.com/document/d/1a-Tg_9NGJ3rPLhpVsBOkfK0rrJzIv0m8L3m0sKormUA/edit?usp=sharing'
  },
  {
    nome: 'Pacotes Cirurgias',
    icone: '⚕️',
    tag: 'Cirurgias',
    cor: '#be123c', bgCor: 'rgba(190,18,60,0.08)',
    url: 'https://docs.google.com/spreadsheets/d/1RKXhEdwr4UMgAZrIfp8xYmjzb6behMtS5QzQQAhYFNM/edit?usp=sharing'
  },
  {
    nome: 'Drive DMADT',
    icone: '📁',
    tag: 'Arquivos',
    cor: '#b45309', bgCor: 'rgba(180,83,9,0.08)',
    url: 'https://drive.google.com/drive/folders/15BzrlhTPhfqiMBcDyCXzoVcmgbGzfbFT?usp=sharing'
  }
];

const grid = document.getElementById('cards-grid');
ITENS.forEach(item => {
  const a = document.createElement('a');
  a.className = 'mon-card';
  a.href = item.url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.dataset.nome = item.nome.toLowerCase();
  a.style.setProperty('--card-color', item.cor);
  a.style.setProperty('--card-bg', item.bgCor);
  a.innerHTML = `
    <div class="mon-icon">${item.icone}</div>
    <div class="mon-name">${item.nome}</div>
    <div class="mon-tag">${item.tag}</div>
    <div class="mon-open">↗ Abrir em nova aba</div>`;
  grid.appendChild(a);
});

function filtrar() {
  const termo = document.getElementById('busca').value.toLowerCase().trim();
  let visiveis = 0;
  document.querySelectorAll('.mon-card').forEach(card => {
    const mostra = !termo || card.dataset.nome.includes(termo);
    card.style.display = mostra ? 'flex' : 'none';
    if (mostra) visiveis++;
  });
  document.getElementById('no-results').classList.toggle('visible', visiveis === 0);
}
</script>
</body>
</html>
